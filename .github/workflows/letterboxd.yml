# Refreshes assets/data/letterboxd.json from your Letterboxd diary once a day.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
# New repository variable named LETTERBOXD_USER with your Letterboxd username.
name: Sync Letterboxd

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch diary
        env:
          LETTERBOXD_USER: ${{ vars.LETTERBOXD_USER }}
        run: node scripts/sync-letterboxd.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- assets/data/letterboxd.json; then
            echo "Nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets/data/letterboxd.json
            git commit -m "Sync Letterboxd diary"
            git push
          fi
